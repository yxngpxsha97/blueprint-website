<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Marifest globe</title>
<style>
  html, body { margin: 0; height: 100%; background: #060d18; overflow: hidden; }
  #globe { width: 100vw; height: 100vh; }
  .mf-badge {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px; font: 700 11px/1 -apple-system,"Segoe UI",system-ui,sans-serif;
    letter-spacing: .04em; color: #0F2A47; background: rgba(255,255,255,.92);
    box-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  .mf-badge .dot { width: 7px; height: 7px; border-radius: 50%; }
  .mf-tip {
    font: 600 12px/1.35 -apple-system,"Segoe UI",system-ui,sans-serif; color: #fff;
    background: rgba(15,42,71,.92); padding: 7px 10px; border-radius: 9px;
    box-shadow: 0 6px 20px rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.12); max-width: 200px;
  }
  .mf-tip b { color: #8ec5ff; }
  .mf-tip span { display:block; font-weight: 500; opacity: .8; font-size: 11px; margin-top: 2px; }
</style>
</head>
<body>
<div id="globe"></div>
<div class="mf-badge"><span class="dot" id="bdot" style="background:#E0A52E"></span><span id="btext">…</span></div>
<script src="https://unpkg.com/globe.gl@2.34.4/dist/globe.gl.min.js"></script>
<script>
  const STATUS = {
    underway: { c: '#2BD98A', label: 'Onderweg' },
    moored:   { c: '#4FA3F0', label: 'Afgemeerd' },
    anchored: { c: '#FFC94D', label: 'Voor anker' },
  };
  // Hide our own badge when framed inside the app (the app shows its own).
  if (location.search.indexOf('chrome=0') >= 0) { const b = document.querySelector('.mf-badge'); if (b) b.style.display = 'none'; }
  const el = document.getElementById('globe');
  const world = Globe()(el)
    .globeImageUrl('https://unpkg.com/three-globe@2.31.0/example/img/earth-blue-marble.jpg')
    .bumpImageUrl('https://unpkg.com/three-globe@2.31.0/example/img/earth-topology.png')
    .backgroundImageUrl('https://unpkg.com/three-globe@2.31.0/example/img/night-sky.png')
    .showAtmosphere(true)
    .atmosphereColor('#4a90d9')
    .atmosphereAltitude(0.22)
    .pointOfView({ lat: 30, lng: 0, altitude: 2.4 }, 0);

  // gentle auto-rotation for the "wow"
  world.controls().autoRotate = true;
  world.controls().autoRotateSpeed = 0.45;
  world.controls().enableDamping = true;

  function size() { world.width(el.clientWidth).height(el.clientHeight); }
  size();
  window.addEventListener('resize', size);

  function color(s) { return (STATUS[s.status] || STATUS.anchored).c; }

  fetch('/api/fleet/positions')
    .then(r => r.json())
    .then(json => {
      const ships = (json.data || []).filter(s => typeof s.lat === 'number' && typeof s.lng === 'number');
      const live = json.isLive;
      document.getElementById('btext').textContent = (live ? 'LIVE AIS' : 'SIMULATIE') + ' · ' + ships.length + ' schepen';
      document.getElementById('bdot').style.background = live ? '#2BD98A' : '#FFC94D';

      world
        .pointsData(ships)
        .pointLat('lat').pointLng('lng')
        .pointColor(color)
        .pointAltitude(0.012)
        .pointRadius(0.32)
        .pointLabel(s =>
          '<div class="mf-tip"><b>' + (s.name || 'Onbekend schip') + '</b>' +
          '<span>IMO ' + (s.imo || '—') + ' · ' + ((STATUS[s.status]||STATUS.anchored).label) + ' · ' + (s.speed ?? 0) + ' kn</span>' +
          (s.destination ? '<span>→ ' + s.destination + '</span>' : '') + '</div>')
        // radar-ping rings on each vessel for extra wow
        .ringsData(ships)
        .ringLat('lat').ringLng('lng')
        .ringColor(s => (t => `rgba(${hexToRgb(color(s))},${1 - t})`))
        .ringMaxRadius(2.2)
        .ringPropagationSpeed(1.4)
        .ringRepeatPeriod(1400);

      // stop spinning while the user interacts, resume after
      world.onZoom(() => { world.controls().autoRotate = false; });
    })
    .catch(() => { document.getElementById('btext').textContent = 'Geen verbinding'; });

  function hexToRgb(h) {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(',');
  }
</script>
</body>
</html>
