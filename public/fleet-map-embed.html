<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Marifest map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body, #map { height: 100%; width: 100%; margin: 0; }
  #map { background: #cfe1f0; }
  .leaflet-container { background: #cfe1f0 !important; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  .mf-badge {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .04em;
    background: rgba(255,255,255,.92); box-shadow: 0 2px 10px rgba(15,42,71,.15);
  }
  .mf-badge .dot { width: 7px; height: 7px; border-radius: 50%; }
  .mf-pop b { color: #0F2A47; }
  .mf-pop .row { font-size: 12px; color: #44566a; margin-top: 2px; }
  .leaflet-popup-content-wrapper { border-radius: 12px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="mf-badge"><span class="dot" id="bdot" style="background:#E0A52E"></span><span id="btext">…</span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Hide our own badge when framed inside the app (the app shows its own).
  if (location.search.indexOf('chrome=0') >= 0) { const b = document.querySelector('.mf-badge'); if (b) b.style.display = 'none'; }
  const STATUS = {
    underway: { c: '#16A06E', label: 'Onderweg' },
    moored:   { c: '#2E6CB5', label: 'Afgemeerd' },
    anchored: { c: '#E0A52E', label: 'Voor anker' },
  };
  const map = L.map('map', { zoomControl: true, attributionControl: false, worldCopyJump: true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 18 }).addTo(map);
  map.setView([30, 0], 2);

  // never show black void — clamp min zoom so the world fills the screen
  const WORLD = L.latLngBounds([[-58, -179.5], [80, 179.5]]);
  function fitWorld() {
    const z = map.getBoundsZoom(WORLD, true);
    map.setMinZoom(z);
    if (map.getZoom() < z) map.setView(map.getCenter(), z, { animate: false });
  }
  map.whenReady(fitWorld);
  window.addEventListener('resize', fitWorld);

  // When embedded in an iframe, Leaflet often inits before the container has its
  // final size — force a recalculation so tiles actually paint.
  function refresh() { map.invalidateSize(); fitWorld(); }
  [150, 500, 1200, 2500].forEach(t => setTimeout(refresh, t));
  window.addEventListener('load', refresh);

  function shipIcon(s) {
    const col = (STATUS[s.status] || STATUS.anchored).c;
    const rot = s.heading || 0;
    const html = '<div style="transform:rotate(' + rot + 'deg)">' +
      '<svg width="22" height="22" viewBox="0 0 24 24" style="filter:drop-shadow(0 1px 2px rgba(15,42,71,.35))">' +
      '<path d="M12 2 L19 21 L12 16.5 L5 21 Z" fill="' + col + '" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>' +
      '</svg></div>';
    return L.divIcon({ html, className: '', iconSize: [22, 22], iconAnchor: [11, 11] });
  }

  fetch('/api/fleet/positions')
    .then(r => r.json())
    .then(json => {
      const ships = json.data || [];
      const live = json.isLive;
      document.getElementById('btext').textContent = (live ? 'LIVE AIS' : 'SIMULATIE') + ' · ' + ships.length + ' schepen';
      document.getElementById('bdot').style.background = live ? '#16A06E' : '#E0A52E';
      ships.forEach(s => {
        if (typeof s.lat !== 'number' || typeof s.lng !== 'number') return;
        const st = STATUS[s.status] || STATUS.anchored;
        L.marker([s.lat, s.lng], { icon: shipIcon(s) }).addTo(map).bindPopup(
          '<div class="mf-pop"><b>' + (s.name || 'Onbekend schip') + '</b>' +
          '<div class="row">IMO ' + (s.imo || '—') + (s.mmsi ? ' · MMSI ' + s.mmsi : '') + '</div>' +
          '<div class="row">' + st.label + ' · ' + (s.speed ?? 0) + ' kn · ' + (s.heading ?? 0) + '°</div>' +
          (s.destination ? '<div class="row">→ ' + s.destination + '</div>' : '') + '</div>'
        );
      });
    })
    .catch(() => { document.getElementById('btext').textContent = 'Geen verbinding'; });
</script>
</body>
</html>
